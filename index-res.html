                /* Contenedor principal que simula el fondo naranja del panel */
        .panel-container {
            background-color: #d65a31; /* Color naranja retro de la cabina */
            padding: 40px;
            display: flex;
            justify-content: center;
            gap: 30px;
            width: fit-content;
            margin: 50px auto;
            border-radius: 10px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 10px 20px rgba(0,0,0,0.3);
        }

        /* Simulación de la ranura oscura por donde se desliza el botón */
        .ranura {
            width: 80px;
            height: 250px;
            background-color: #1a1a1a; /* Fondo oscuro de la ranura */
            border-radius: 8px;
            position: relative;
            box-shadow: inset 3px 3px 10px rgba(0,0,0,0.8), inset -3px -3px 10px rgba(255,255,255,0.1);
            overflow: hidden;
        }

        /* Estilo base de la palanca-botón */
        .palanca-btn {
            width: 70px;
            height: 70px;
            background-color: #ffffff; /* Bloque blanco principal */
            border: none;
            border-radius: 8px;
            position: absolute;
            left: 5px;
            cursor: pointer;
            
            /* Tipografía y diseño de la letra */
            font-family: 'Arial Black', sans-serif;
            font-size: 2.2rem;
            color: #005691; /* Color azul de las letras del panel */
            
            /* Efecto 3D del botón tipo bloque */
            box-shadow: 0 5px 0px #b3b3b3, 
                        3px 8px 10px rgba(0,0,0,0.4);
            
            /* Animación suave al cambiar de posición */
            transition: top 0.3s ease, box-shadow 0.3s ease;
        }

        /* Posición por defecto: APAGADO / ABAJO */
        .palanca-btn[aria-pressed="false"] {
            top: 170px; /* Se queda en la parte inferior de la ranura */
        }

        /* Posición modificada: ACTIVO / ARRIBA */
        .palanca-btn[aria-pressed="true"] {
            top: 10px; /* Sube a la parte superior de la ranura */
            color: #0088cc; /* Un azul un poco más brillante al activarse */
            box-shadow: 0 5px 0px #b3b3b3, 
                        0px 2px 5px rgba(0,0,0,0.2);
        }

        /* Pequeño indicador luminoso decorativo encima de cada ranura */
        .indicador-luces {
            width: 40px;
            height: 8px;
            background-color: #3a6073;
            margin: 0 auto 15px auto;
            border-radius: 2px;
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.5);
        }
        
        /* Contenedor individual para alinear la luz con su respectiva ranura */
        .modulo-control {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
    </style>
</head>
