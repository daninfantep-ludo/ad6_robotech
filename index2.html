    <script>
document.addEventListener("click", (event) => {
    const hexButton = event.target.closest(".hex-boton-rojo");

    if (!hexButton) {
        return;
    }

    const agotado = hexButton.classList.toggle("agotado");

    hexButton.setAttribute(
        "aria-pressed",
        agotado ? "true" : "false"
    );

    
});
</script>
